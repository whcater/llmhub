<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Murmur 实时字幕</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="full">
    <div class="toolbar">
      <button id="btn-toggle" class="primary">开始</button>
      <button id="btn-caption">字幕模式</button>
      <select id="device"></select>
      <button id="btn-refresh" title="刷新设备列表">↻</button>
      <div class="spacer"></div>
      <button id="btn-copy">复制</button>
      <button id="btn-clear">清空</button>
      <button id="btn-settings">设置</button>
      <span id="status" class="status">未开始</span>
    </div>

    <div id="settings">
      <label>服务地址</label>
      <input id="server-url" placeholder="ws://127.0.0.1:8787" />
      <label>Token</label>
      <input id="auth-token" type="password" placeholder="LLMHub Bearer token" />
      <label><input id="save-recording" type="checkbox" /> 保存录音</label>
      <button id="btn-save" class="primary">保存</button>
    </div>

    <div id="transcript"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
